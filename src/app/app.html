<main class="stage" #stage>
  <canvas class="sky" #sky aria-hidden="true"></canvas>
  <div class="aurora" aria-hidden="true"></div>
  <div class="moon" aria-hidden="true"></div>

  <!-- Himalayan ridgelines, three depths for parallax -->
  <svg class="range" viewBox="0 0 1440 320" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
    <defs>
      <linearGradient id="ridge-far" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#2a3670" />
        <stop offset="1" stop-color="#121a42" />
      </linearGradient>
      <linearGradient id="ridge-mid" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#18214d" />
        <stop offset="1" stop-color="#0b1130" />
      </linearGradient>
      <linearGradient id="ridge-near" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#0c1129" />
        <stop offset="1" stop-color="#05070f" />
      </linearGradient>
      <linearGradient id="snow" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#f2f5ff" stop-opacity=".9" />
        <stop offset="1" stop-color="#c9d4ff" stop-opacity="0" />
      </linearGradient>
      <linearGradient id="mist" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#8ea2ff" stop-opacity="0" />
        <stop offset=".6" stop-color="#8ea2ff" stop-opacity=".12" />
        <stop offset="1" stop-color="#8ea2ff" stop-opacity="0" />
      </linearGradient>
    </defs>

    <g class="ridge far">
      <path fill="url(#ridge-far)"
        d="M0 230 L90 190 L150 205 L230 140 L270 160 L330 95 L370 120 L420 70 L470 110 L520 100 L580 150 L640 118 L700 60 L740 84 L790 38 L850 95 L900 85 L960 130 L1020 104 L1080 150 L1140 112 L1200 145 L1260 108 L1330 160 L1390 140 L1440 170 V320 H0 Z" />
      <path fill="url(#snow)"
        d="M316 106 L330 95 L346 108 L336 105 L330 112 Z
           M398 88 L420 70 L446 92 L433 88 L425 98 L414 89 Z
           M684 76 L700 60 L717 73 L707 71 L700 80 Z
           M766 60 L790 38 L814 62 L801 57 L793 68 L782 58 Z
           M1124 124 L1140 112 L1156 124 L1146 122 Z
           M1246 118 L1260 108 L1274 119 L1264 117 Z" />
    </g>
    <rect class="mist" x="-40" y="150" width="1520" height="110" fill="url(#mist)" />
    <g class="ridge mid">
      <path fill="url(#ridge-mid)"
        d="M0 262 L120 222 L200 246 L300 200 L380 236 L480 190 L560 230 L660 205 L760 240 L860 196 L960 232 L1060 202 L1160 242 L1260 212 L1360 246 L1440 226 V320 H0 Z" />
    </g>
    <g class="ridge near">
      <path fill="url(#ridge-near)" d="M0 292 Q180 256 360 280 T720 276 T1080 286 T1440 270 V320 H0 Z" />
    </g>
  </svg>

  <div class="scene">
    <div class="halo" aria-hidden="true"></div>
    <div class="pool" #pool aria-hidden="true"></div>

    <!-- The rig carries the intro fade/blur so the card's own 3D context is never flattened. -->
    <div class="rig" #rig>
      <div class="card" #card role="img" aria-label="Krisha Bhandari's driving license, front and back">
        <div class="face front">
          <img src="card/front.webp" alt="" width="1600" height="1009" draggable="false" fetchpriority="high" />
          <i class="holo"></i><i class="shade"></i><i class="glare"></i>
        </div>

        @for (transform of edges; track $index) {
          <i class="edge" [style.transform]="transform"></i>
        }

        <div class="face back">
          <img src="card/back.webp" alt="" width="1600" height="1009" draggable="false" />
          <i class="holo"></i><i class="shade"></i><i class="glare"></i>
        </div>
      </div>
    </div>
  </div>
</main>
